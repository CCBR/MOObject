url: https://ccbr.github.io/MOObject/
template:
  bootstrap: 5
  bslib:
    bootswatch: yeti
    primary: "#296b7f"
    secondary: "#7cc349"
    base_font: {google: "Roboto"}
    heading_font: {google: "Roboto"}
    code_font: {google: "Roboto Mono"}
    border-radius: 0
    btn-border-radius: 3px
    grid-gutter-width: 3rem
    pkgdown-nav-height: 78px
footer:
  structure:
    left: [developed_by]

development:
  mode: auto
authors:
  Kelly Sovacool:
    href: "https://github.com/kelly-sovacool"
  Philip Homan:
    href: "https://github.com/phoman14"
  Vishal Koparde:
    href: "https://github.com/kopardev"
  CCR Collaborative Bioinformatics Resource:
    href: "https://github.com/CCBR"
  footer:
    roles: [cph, fnd]
    text: "Created by the"

navbar:
  left:
    - text: Reference
      href: reference/index.html
    - text: Changelog
      href: news/index.html
    - text: MOSuite
      icon: fa-arrow-up-right-from-square
      href: https://ccbr.github.io/MOSuite/
      target: _blank


reference:
- title: multiOmicDataSet class
  contents:
    - multiOmicDataSet
- title: Constructors
  contents: starts_with("create")
- title: Read & Write
  contents:
    - starts_with('read')
    - starts_with('write')
- title: Helpers
  contents:
    - extract_counts
